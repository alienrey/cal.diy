name: Publish containers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/publish-containers.yml
      - Dockerfile
      - apps/api/v2/Dockerfile
      - docker-compose.registry.yml
      - scripts/start.sh
      - scripts/replace-placeholder.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-containers-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'release' }}
  cancel-in-progress: false

jobs:
  check-types:
    uses: ./.github/workflows/check-types.yml

  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: check-types
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
        image:
          - service: web
            dockerfile: Dockerfile
          - service: api
            dockerfile: apps/api/v2/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        env:
          SERVICE: ${{ matrix.image.service }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${SERVICE}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish commit image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          platforms: linux/${{ matrix.architecture }}
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-${{ matrix.architecture }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            DATABASE_URL=postgresql://build:build@localhost:5432/calendso
            DATABASE_DIRECT_URL=postgresql://build:build@localhost:5432/calendso
            NEXT_PUBLIC_WEBAPP_URL=http://NEXT_PUBLIC_WEBAPP_URL_PLACEHOLDER
            NEXT_PUBLIC_API_V2_URL=http://NEXT_PUBLIC_API_V2_URL_PLACEHOLDER/v2
            NEXT_PUBLIC_LICENSE_CONSENT=${{ vars.NEXT_PUBLIC_LICENSE_CONSENT }}
            NEXT_PUBLIC_WEBSITE_TERMS_URL=${{ vars.NEXT_PUBLIC_WEBSITE_TERMS_URL }}
            NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL=${{ vars.NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL }}
            NEXT_PUBLIC_SINGLE_ORG_SLUG=${{ vars.NEXT_PUBLIC_SINGLE_ORG_SLUG }}
            ORGANIZATIONS_ENABLED=${{ vars.ORGANIZATIONS_ENABLED || 'false' }}
            CALCOM_TELEMETRY_DISABLED=1
            CSP_POLICY=${{ vars.CSP_POLICY }}
          cache-from: type=gha,scope=caldiy-${{ matrix.image.service }}-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=caldiy-${{ matrix.image.service }}-${{ runner.arch }}

  verify:
    needs: build
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    permissions:
      contents: read
      packages: write
    env:
      COMPOSE_FILE: docker-compose.registry.yml
      COMPOSE_PROJECT_NAME: caldiy-ci
      CALCOM_IMAGE_TAG: sha-${{ github.sha }}-${{ matrix.architecture }}
      NEXT_PUBLIC_WEBAPP_URL: http://calcom:3000
      API_URL: http://calcom-api:80
      NEXT_PUBLIC_API_V2_URL: http://calcom-api:80/v2
      POSTGRES_PASSWORD: ci-postgres-password
      NEXTAUTH_SECRET: ci-nextauth-secret-for-disposable-database-only
      CALENDSO_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"
      JWT_SECRET: ci-jwt-secret-for-disposable-database-only
      CRON_API_KEY: ci-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image namespace
        run: echo "CALCOM_IMAGE_NAMESPACE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start stack and wait for migrations and health checks
        run: docker compose up --detach --wait --wait-timeout 600
      - name: Verify runtime URLs
        run: |
          docker compose exec -T calcom node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('apps/web/.next/routes-manifest.json', 'utf8'));
          const rewrite = manifest.rewrites.afterFiles.find(route => route.source === '/api/v2/:path*');
          const expected = `${process.env.NEXT_PUBLIC_API_V2_URL}/:path*`;
          if (rewrite?.destination !== expected) throw new Error(`API rewrite must point to ${expected}`);
          NODE
      - name: Show failure logs
        if: failure()
        run: docker compose logs --no-color --tail 150
      - name: Remove disposable test stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified multi-platform images
        run: |
          namespace="ghcr.io/${GITHUB_REPOSITORY,,}"
          for service in web api; do
            image="${namespace}-${service}"
            tags=(--tag "${image}:sha-${GITHUB_SHA}")
            if [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/tags/v* ]]; then
              tags+=(--tag "${image}:latest")
            fi
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              tags+=(--tag "${image}:${GITHUB_REF_NAME}")
            fi
            docker buildx imagetools create "${tags[@]}" \
              "${image}:sha-${GITHUB_SHA}-amd64" "${image}:sha-${GITHUB_SHA}-arm64"
            echo "- ${image}:sha-${GITHUB_SHA} (amd64 and arm64)" >> "$GITHUB_STEP_SUMMARY"
          done
